services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: formarede-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: formarede
      POSTGRES_PASSWORD: formarede
      POSTGRES_DB: formarede
    ports:
      - "5432:5432"
    volumes:
      - formarede_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U formarede -d formarede"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: formarede-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - formarede_redis:/data

volumes:
  formarede_pg:
  formarede_redis:
